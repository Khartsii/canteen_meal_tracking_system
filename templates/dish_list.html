{% extends "base.html" %}
{% block title %}Меню столовой{% endblock %}
{% block content %}
  <h1>Меню столовой</h1>
  <div class="panel">
    <ul class="list-group list-group-flush">
      {% for dish in dishes %}
        <li class="list-group-item">
          <a href="{% url 'menu:detail' name=dish.name %}">{{ dish.name }}</a>
          <span class="ms-2">
            {% if dish.available %}Доступно{% else %}Недоступно{% endif %}
          </span>
        </li>
      {% empty %}
        <li class="list-group-item">В меню пока нет блюд.</li>
      {% endfor %}
    </ul>
  </div>
{% endblock %}
