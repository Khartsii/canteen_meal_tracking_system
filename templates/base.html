<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Столовая{% endblock %}</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.9/dist/css/bootstrap.min.css" integrity="sha384-yEPZ7jP9S0QKiUQ0m3jjsO4ProIW7wvR9gXkI7JOGa2XVsw53Yke2bsdkBbjmmiX" crossorigin="anonymous">
  <style>
    body { background: #f6f8f4; color: #1e2b24; font-family: system-ui, sans-serif; margin: 0; }
    .site-header { background: #173f32; color: white; }
    .site-header a { color: white; }
    .site-width { max-width: 58rem; margin: 0 auto; padding: 1.25rem; }
    .site-nav { display: flex; gap: 1rem; flex-wrap: wrap; align-items: baseline; }
    .site-name { font-weight: 700; margin-right: auto; }
    .panel { background: white; border: 1px solid #d7e1d9; border-radius: .75rem; padding: 1.25rem; }
  </style>
</head>
<body>
<header class="site-header">
  <nav class="site-width site-nav" aria-label="Основная навигация">
    <a class="site-name" href="{% url 'homepage:index' %}">Столовая</a>
    <a href="{% url 'menu:list' %}">Меню</a>
    <a href="{% url 'orders:list' %}">Заказы</a>
  </nav>
</header>
<main class="site-width">
  {% block content %}{% endblock %}
</main>
</body>
</html>
